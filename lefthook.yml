pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npx tsc --noEmit

    lint:
      glob: "*.{ts,tsx}"
      run: npx eslint .

    agent-rules-guard:
      run: |
        if grep -q "nextjs-agent-rules" AGENTS.md CLAUDE.md 2>/dev/null; then
          echo "AGENTS.md carries the block next dev writes when it detects a coding agent. Remove it before committing; the repo owns its own agent instructions."
          exit 1
        fi

    check-todos:
      glob: "*.{ts,tsx}"
      run: |
        if grep -Hn "TODO\|FIXME" {staged_files} 2>/dev/null; then
          echo "Warning: TODO/FIXME comments found in staged files"
        fi

pre-push:
  parallel: false
  commands:
    typecheck:
      run: npx tsc --noEmit
      priority: 1

    build:
      run: npm run build
      priority: 2
